<!-- ============================================================
     GRAPHIC BEAT — worked example for the hero story
     "a car driving and stops at a house"
     ============================================================
     This is the ZERO-MEDIA hero: no video, no frame sequence, no
     generation credits. A polygon scene in token colours, choreographed
     by the driver's --beat-p (0..1 within this beat's window).

     HOW TO ADAPT for a different `## Hero story` sentence:
       1. Break the sentence at its verbs into 2-4 beats.
          "a car driving and stops at a house" -> approach / arrive+stop.
          "coffee poured into a cup, steam rising" -> pour / steam.
          "a roof going from worn to new" -> worn / transition / new.
       2. One [data-graphic="N"] block per beat, in DOM order.
       3. 2-6 shapes per beat. Two well-placed polygons read as
          confident design; twenty read as clip-art.
       4. Every fill is a token (var(--color-*)). The graphic then
          re-skins with the chosen direction instead of fighting it.
       5. transform + opacity ONLY. Never animate `points` or `d`.
       6. No `transition` on anything reading --beat-p: reverse
          scrubbing would visibly lag the scroll.

     The scene at --beat-p:0 must read as a FINISHED hero — it is what
     reduced-motion and no-JS visitors keep, and it is the frame the
     operator judges at the Phase 2 gate.
     ============================================================ -->

<div class="hero-stage__graphic" data-graphic="1">
  <svg class="scene" viewBox="0 0 1440 812" preserveAspectRatio="xMidYMid slice"
       role="img" aria-label="[PLACEHOLDER: one-line description of the scene]">

    <!-- sky wash: two flat polygons, not a gradient, so it reads graphic -->
    <polygon class="sky"   points="0,0 1440,0 1440,470 0,530"/>
    <polygon class="ridge" points="0,530 380,455 760,505 1120,440 1440,470 1440,560 0,610"/>

    <!-- ground plane -->
    <polygon class="ground" points="0,600 1440,556 1440,812 0,812"/>
    <!-- road: the car's track, angled so the scene has depth -->
    <polygon class="road" points="0,700 1440,640 1440,760 0,812"/>

    <!-- the house: roof polygon + body + door + two windows.
         Sits at rest from frame 0 — it is the destination, not a
         surprise. -->
    <g class="house">
      <polygon class="house-roof" points="880,470 1080,392 1280,470"/>
      <rect class="house-body"    x="920" y="470" width="320" height="150"/>
      <rect class="house-door"    x="1055" y="540" width="50"  height="80"/>
      <rect class="window w1"     x="960"  y="500" width="56"  height="44"/>
      <rect class="window w2"     x="1150" y="500" width="56"  height="44"/>
    </g>

    <!-- two trees, pure triangles, for rhythm -->
    <polygon class="tree t1" points="300,600 340,470 380,600"/>
    <polygon class="tree t2" points="700,585 730,485 760,585"/>

    <!-- the car: body polygon + cabin + two wheels. Starts off-canvas
         left; the CSS below drives it to the house and settles it. -->
    <g class="car">
      <polygon class="car-body"  points="0,660 30,620 130,620 170,660 170,690 0,690"/>
      <polygon class="car-cabin" points="45,620 65,592 120,592 132,620"/>
      <circle  class="wheel wf" cx="40"  cy="692" r="22"/>
      <circle  class="wheel wr" cx="140" cy="692" r="22"/>
    </g>

    <!-- dust puffs: exist only while moving, gone once stopped -->
    <g class="dust">
      <circle class="puff p1" cx="-30" cy="686" r="14"/>
      <circle class="puff p2" cx="-70" cy="678" r="10"/>
      <circle class="puff p3" cx="-104" cy="690" r="7"/>
    </g>
  </svg>
</div>

<!-- ============================================================
     Its CSS. Put this in the page's style.css next to the stage CSS.
     ============================================================ -->
<style>
/* Shape fills: tokens only. --hero-ink is a per-build alias so the whole
   scene can be re-keyed from one line if the direction changes. */
.scene{--hero-ink:var(--color-primary)}
.scene .sky        {fill:var(--color-surface)}
.scene .ridge      {fill:var(--color-primary); opacity:.16}
.scene .ground     {fill:var(--color-surface); filter:brightness(.94)}
.scene .road       {fill:var(--hero-ink); opacity:.10}
.scene .tree       {fill:var(--hero-ink); opacity:.28}
.scene .house-roof {fill:var(--hero-ink)}
.scene .house-body {fill:var(--hero-ink); opacity:.72}
.scene .house-door {fill:var(--color-bg); opacity:.55}
.scene .car-body   {fill:var(--color-accent, var(--hero-ink))}
.scene .car-cabin  {fill:var(--color-bg); opacity:.85}
.scene .wheel      {fill:var(--color-text)}
.scene .puff       {fill:var(--color-text); opacity:.10}

/* ---- choreography: everything below reads --beat-p (0..1) ----
   EASE-OUT without a transition: p_eased = 2p - p^2. calc() allows
   number*number, and --beat-p is unitless, so this is valid CSS and
   stays exact under reverse scrubbing (which a transition would not). */
.scene{--p:var(--beat-p,0);
       --ease-out:calc(2 * var(--p) - var(--p) * var(--p))}

/* The car crosses ~62% of the viewBox and decelerates into the drive. */
.scene .car{
  transform:translate3d(calc(var(--ease-out) * 62%), 0, 0);
  will-change:transform;
}
/* Wheels spin with distance travelled, so they stop when the car does. */
.scene .wheel{
  transform-box:fill-box; transform-origin:center;
  transform:rotate(calc(var(--ease-out) * 1080deg));
}
/* Dust follows the car but dies out in the last third — the visual cue
   that the car has ARRIVED, which is the second half of the sentence. */
.scene .dust{
  transform:translate3d(calc(var(--ease-out) * 62%), 0, 0);
  opacity:calc(1 - var(--p) * 1.6);
}
/* Windows warm up as the car settles: the payoff beat. Clamped so the
   value is legal at every p, not just inside the window. */
.scene .window{
  fill:var(--color-accent, var(--hero-ink));
  opacity:clamp(0, calc((var(--p) - .62) * 3.4), 1);
}
/* The house lifts a few pixels as it becomes the subject — small, and
   the only thing that moves besides the car. */
.scene .house{
  transform:translate3d(0, calc(-6px * var(--p)), 0);
}

/* Mobile: the scene is cropped by preserveAspectRatio="slice", so pull
   the composition tighter instead of tracking a focal point. */
@media (max-width:640px){
  .scene .car {transform:translate3d(calc(var(--ease-out) * 54%),0,0) scale(1.15);
               transform-origin:left bottom}
  .scene .tree{display:none}
}

/* Reduced motion: the stage CSS already freezes transforms; make the
   rest state the DESIGNED state rather than a mid-run accident — car
   parked at the house, windows lit. */
@media (prefers-reduced-motion:reduce){
  .scene{--p:1}
  .scene .dust{display:none}
}
</style>
